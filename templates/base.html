<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MalCrawl</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root[data-theme='dark'] {
            --bs-body-bg: #212529;
            --bs-body-color: #f8f9fa;
            --bs-secondary-bg: #343a40;
            --bs-secondary-color: #ced4da;
        }
        body {
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
        }
        .malcrawl-header {
            background-color: #343a40;
            color: white;
            padding: 1rem;
        }
        .theme-toggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
        }
        .nav-tabs .nav-link.active {
            background-color: #0d6efd;
            color: white;
        }
        .nav-tabs .nav-link {
            color: #0d6efd;
        }
        .suspicious {
            color: #dc3545;
            font-weight: bold;
        }
        .clean {
            color: #198754;
            font-weight: bold;
        }
        footer {
            margin-top: 3rem;
            padding: 1rem;
            background-color: var(--bs-secondary-bg);
            text-align: center;
            font-size: 0.9rem;
            color: var(--bs-secondary-color);
        }
        #progressContainer {
            display: none;
            margin-top: 1rem;
        }
    </style>
</head>
<body data-theme="light">
    <header class="malcrawl-header text-center position-relative">
        <h1>MalCrawl - Website Threat Analyzer</h1>
        <button class="btn btn-sm btn-outline-light theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
    </header>

    <main class="container my-4">
        <div id="progressContainer">
            <label for="scanProgress" class="form-label">Scanning in progress...</label>
            <div class="progress">
                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 100%"></div>
            </div>
        </div>
        {% block content %}{% endblock %}
    </main>

    <footer>
        &copy; {{ year }} MalCrawl. For forensic analysis only. Not responsible for any catastrophic consequences or breaches in the space-time continuum.
    </footer>

    <script>
        function toggleTheme() {
            const root = document.documentElement;
            const current = root.getAttribute('data-theme') || 'light';
            root.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            if (form) {
                form.addEventListener('submit', () => {
                    const container = document.getElementById('progressContainer');
                    if (container) container.style.display = 'block';
                });
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
