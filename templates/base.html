<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MalCrawl</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .malcrawl-header {
            background-color: #343a40;
            color: white;
            padding: 1rem;
        }
        .nav-tabs .nav-link.active {
            background-color: #0d6efd;
            color: white;
        }
        .nav-tabs .nav-link {
            color: #0d6efd;
        }
        .suspicious {
            color: #dc3545;
            font-weight: bold;
        }
        .clean {
            color: #198754;
            font-weight: bold;
        }
        footer {
            margin-top: 3rem;
            padding: 1rem;
            background-color: #dee2e6;
            text-align: center;
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <header class="malcrawl-header text-center">
        <h1>MalCrawl - Website Threat Analyzer</h1>
    </header>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <footer>
        &copy; {{ year }} MalCrawl. For forensic analysis only. Not responsible for any catastrophic consequences or breaches in the space-time continuum.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
