<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MalCrawl</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bs-body-bg: #212529;
            --bs-body-color: #f8f9fa;
            --bs-secondary-bg: #343a40;
            --bs-secondary-color: #ced4da;
        }
        body {
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
        }
        .malcrawl-header {
            background-color: #343a40;
            color: white;
            padding: 1rem;
        }
        .nav-tabs .nav-link.active {
            background-color: #0d6efd;
            color: white;
        }
        .nav-tabs .nav-link {
            color: #0d6efd;
        }
        .suspicious {
            color: #dc3545;
            font-weight: bold;
        }
        .clean {
            color: #198754;
            font-weight: bold;
        }
        footer {
            margin-top: 3rem;
            padding: 1rem;
            background-color: var(--bs-secondary-bg);
            text-align: center;
            font-size: 0.9rem;
            color: var(--bs-secondary-color);
        }
        #progressContainer {
            display: none;
            margin-top: 1rem;
        }
        .card-img-top {
            height: 200px;
            object-fit: contain;
        }
        .copy-button {
            background-color: #444;
            color: white;
            border: none;
            padding: 3px 8px;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            float: right;
            margin-bottom: 5px;
        }
        .copy-button:hover {
            background-color: #666;
        }
        .code-block-container {
            position: relative;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <header class="malcrawl-header text-center position-relative">
        <h1>MalCrawl - Website Threat Analyzer</h1>
        <nav class="mt-2">
            <a href="{{ url_for('index') }}" class="btn btn-sm btn-light">Home</a>
        </nav>
    </header>

    <main class="container my-4">
        <div id="progressContainer">
            <label class="form-label">Scanning <span id="currentUrl"></span> - Page <span id="currentPage">0</span> of <span id="totalPages">0</span> (<span id="stage">queueing</span>)</label>
            <div class="progress">
                <div id="scanProgressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
            </div>
            <div class="mt-2">
                <button class="btn btn-sm btn-secondary" id="toggleLog">Toggle Logs</button>
                <button class="btn btn-sm btn-danger" id="stopScan">Stop Scan</button>
            </div>
            <pre id="logConsole" class="bg-dark text-white p-2 mt-2 d-none" style="max-height:200px;overflow-y:auto"></pre>
        </div>
        {% block content %}{% endblock %}
    </main>

    <footer>
        &copy; {{ year }} MalCrawl. For forensic analysis only. Not responsible for any catastrophic consequences or breaches in the space-time continuum.
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            const progress = document.getElementById('progressContainer');
            const urlSpan = document.getElementById('currentUrl');
            const pageSpan = document.getElementById('currentPage');
            const totalSpan = document.getElementById('totalPages');
            const bar = document.querySelector('#scanProgressBar');
            const log = document.getElementById('logConsole');
            const stageSpan = document.getElementById('stage');
            let poll;

            function fetchStatus() {
                fetch('/scan-status')
                    .then(r => r.json())
                    .then(data => {
                        urlSpan.textContent = data.current_url || '';
                        pageSpan.textContent = data.current_index;
                        totalSpan.textContent = data.total;
                        if (data.total > 0) {
                            const pct = Math.min(100, Math.round((data.current_index / data.total) * 100));
                            bar.style.width = pct + '%';
                        }
                        if (data.stage) {
                            stageSpan.textContent = data.stage;
                        }
                        if (data.logs) {
                            log.textContent = data.logs.join('\n');
                        }
                        if (data.done) {
                            clearInterval(poll);
                            if (data.domain) {
                                window.location.href = '/site/' + data.domain;
                            }
                        }
                    });
            }

            if (form) {
                form.addEventListener('submit', e => {
                    e.preventDefault();
                    progress.style.display = 'block';
                    const fd = new FormData(form);
                    fetch('/start_scan', { method: 'POST', body: fd })
                        .then(() => {
                            poll = setInterval(fetchStatus, 1000);
                        });
                });
            }

            const stopBtn = document.getElementById('stopScan');
            if (stopBtn) {
                stopBtn.addEventListener('click', () => {
                    fetch('/stop_scan', { method: 'POST' });
                });
            }

            const toggleBtn = document.getElementById('toggleLog');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    log.classList.toggle('d-none');
                });
            }

            const buttons = document.querySelectorAll('.copy-button');
            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    const codeBlock = button.nextElementSibling?.querySelector('code');
                    if (codeBlock) {
                        const text = codeBlock.innerText;
                        navigator.clipboard.writeText(text).then(() => {
                            const orig = button.textContent;
                            button.textContent = '✅ Copied!';
                            setTimeout(() => (button.textContent = orig), 2000);
                        });
                    }
                });
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
