{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Recent Scans</h2>
<ul>
  {% for domain in domains %}
  <li><a href="{{ url_for('site_results', domain=domain) }}">{{ domain }}</a></li>
  {% endfor %}
  {% if not domains %}
  <li>No scans recorded yet.</li>
  {% endif %}
</ul>
{% endblock %}
