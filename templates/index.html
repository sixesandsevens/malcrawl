{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">New Scan</h2>
<form method="post" class="vstack gap-3">
  <div>
    <label class="form-label">Target URL:</label>
    <input type="text" name="url" class="form-control" required>
  </div>
  <div>
    <label class="form-label">Depth:</label>
    <input type="number" name="depth" min="1" max="5" value="2" class="form-control">
  </div>
  <div>
    <label class="form-label">Target Pattern:</label>
    <input type="text" name="target_pattern" class="form-control" placeholder="e.g. initWmLoginPosition">
  </div>
  <div>
    <label class="form-label">User-Agent:</label>
    <select name="user_agent" class="form-select">
      {% for ua in user_agents %}
      <option value="{{ ua }}">{{ ua }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" name="render_js" id="render_js">
    <label class="form-check-label" for="render_js">Enable JS Rendering (Selenium)</label>
  </div>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" name="include_shots" id="include_shots">
    <label class="form-check-label" for="include_shots">Capture Screenshots</label>
  </div>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" name="debug_mode" id="debug_mode">
    <label class="form-check-label" for="debug_mode">Debug Mode (include filtered scripts)</label>
  </div>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" name="full_logging" id="full_logging" {% if full_logging %}checked{% endif %}>
    <label class="form-check-label" for="full_logging">Enable full logging</label>
  </div>
  <div>
    <label class="form-label">Output Format:</label>
    <select name="output_format" class="form-select">
      {% for fmt in output_formats %}
      <option value="{{ fmt }}">{{ fmt|upper }}</option>
      {% endfor %}
    </select>
  </div>
  <button type="submit" class="btn btn-primary">Run Scan</button>
</form>
{% endblock %}
