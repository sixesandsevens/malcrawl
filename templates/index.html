<!DOCTYPE html>
<html>
<head>
    <title>MalCrawl Submission</title>
</head>
<body>
    <h1>Submit a URL to Scan</h1>
    <form method="post">
        <label>Target URL:</label>
        <input type="text" name="url" required><br><br>

        <label>Depth:</label>
        <input type="number" name="depth" min="1" max="5" value="2"><br><br>

        <label>User-Agent:</label>
        <select name="user_agent">
            {% for ua in user_agents %}
            <option value="{{ ua }}">{{ ua }}</option>
            {% endfor %}
        </select><br><br>

        <label>Enable JS Rendering (Selenium):</label>
        <input type="checkbox" name="render_js"><br><br>

        <label>Output Format:</label>
        <select name="output_format">
            {% for fmt in output_formats %}
            <option value="{{ fmt }}">{{ fmt|upper }}</option>
            {% endfor %}
        </select><br><br>

        <button type="submit">Run Scan</button>
    </form>
</body>
</html>
